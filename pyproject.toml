[project]
name = "pdf-rag-chatbot"
version = "0.1.0"
description = "PDF RAG Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2"
]

[tool.vercel]
entrypoint = "app:app"
